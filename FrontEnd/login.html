<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Sophie Bluel - Architecte d'intérieur</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Work+Sans:wght@400;700&display=swap"
		rel="stylesheet">
	<meta name="description" content="Architecte d'intérieur Sophie Bluel">
	<link rel="stylesheet" href="./assets/style.css">
	<script type="module" src="./assets/login.js" defer></script>
</head>

<body class="login-page">
	<header>
		<a class="site-logo" href="./index.html" aria-label="Accueil">
			<h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
		</a>
		<nav>
			<ul>
				<li><a href="#">projets</a></li>
				<li><a href="#">contact</a></li>
				<li><a class="active" href="./login.html">login</a></li>
				<li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
			</ul>
		</nav>
	</header>

	<main>
		<section id="login">
			<h2>Log In</h2>
			<form action="#" method="post">
				<label for="email">E-mail</label>
				<input type="email" name="email" id="email" autocomplete="username" required>
				<label for="password">Mot de passe</label>
				<input type="password" name="password" id="password" autocomplete="current-password" required>
				<button class="login-button" type="submit">Se connecter</button>
			</form>
			<p><a href="#">Mot de passe oublié ?</a></p>
		</section>
	</main>

	<footer>
		<nav>
			<ul>
				<li>Mentions Légales</li>
			</ul>
		</nav>
	</footer>
</body>

</html>
